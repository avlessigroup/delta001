<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">

    <title>BACA-APP — Connexion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style-baca.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>

<body class="bg-light">


    <button id="installPwaButton" type="button" class="btn btn-outline-primary d-none">
        Installer BACA-APP
    </button>

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="card shadow-sm login-card">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h1 class="h3 text-primary">BACA-APP</h1>
                    <p class="text-muted mb-0">
                        Système de gestion logistique
                    </p>
                    <small class="text-muted">
                        Base Aérienne de Cana — Usage interne
                    </small>
                </div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Adresse courriel
                        </label>

                        <input type="email" id="email" class="form-control" placeholder="nom@baca.bj" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mot de passe
                        </label>

                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <button type="submit" id="loginButton" class="btn btn-primary w-100">
                        Se connecter
                    </button>

                    <div id="loginMessage" class="mt-3"></div>
                </form>

            </div>


        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pwa.js"></script>
    <script src="assets/js/offline-db.js"></script>
</body>

</html>
